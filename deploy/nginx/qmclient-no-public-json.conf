# 放在 QmClient 的 HTTPS server 块内；拒绝浏览器直接读取 JSON。
# 保留 /ws 与 /ws/editor 升级，以及称号兑换、资料修改等 POST 操作。
set $qm_public_http_read "$request_method:$uri";
if ($qm_public_http_read ~ "^(GET|HEAD):/(api/v1/(?!word-filter$)|ddnet/15/servers[.]json$|healthz/?$|client/version/?$|token/?$|report/?$|users[.]json/?$|qm/|playtime/|editor/collab/)") {
    return 404;
}
